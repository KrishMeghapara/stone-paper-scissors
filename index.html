<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors | Ultimate Showdown</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --neon-red: #ff0000;
            --dark-bg: #121212;
        }
        
        body {
            background: var(--dark-bg);
            font-family: 'Poppins', sans-serif;
            color: #fff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            text-align: center;
            padding: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(90deg, var(--neon-red), var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 8s ease infinite;
            background-size: 300% 300%;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 60px 0;
            flex-wrap: wrap;
        }
        
        .choice-btn {
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
        }
        
        .choice-btn::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            z-index: -1;
            background: linear-gradient(45deg, var(--neon-red), var(--neon-blue), var(--neon-pink), var(--neon-red));
            background-size: 400%;
            border-radius: 20px;
            opacity: 0;
            transition: 0.5s;
        }
        
        .choice-btn:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: transparent;
        }
        
        .choice-btn:hover::before {
            opacity: 1;
            animation: gradientShift 4s linear infinite;
        }
        
        .choice-btn img {
            width: 150px;
            height: auto;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }
        
        .choice-btn:hover img {
            transform: scale(1.1);
        }
        
        #textprint {
            margin: 40px 0;
            font-size: 1.8rem;
            font-weight: 600;
            min-height: 60px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        
        .score-container {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin: 40px 0;
        }
        
        .score {
            font-size: 1.6rem;
            position: relative;
            padding: 0 20px;
        }
        
        .score::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
        }
        
        .score-value {
            font-size: 2rem;
            font-weight: 700;
            margin-left: 10px;
            color: var(--neon-pink);
        }
        
        #reset-btn {
            background: linear-gradient(135deg, var(--neon-red), var(--neon-pink));
            color: #fff;
            border: none;
            width: 160px;
            height: 50px;
            border-radius: 25px;
            margin-top: 40px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 255, 0.3);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        #reset-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-red));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        #reset-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 0, 255, 0.4);
        }
        
        #reset-btn:hover::before {
            opacity: 1;
        }
        
        #reset-btn:active {
            transform: translateY(1px);
        }
        
        /* Glow effects */
        .glow {
            text-shadow: 0 0 10px currentColor;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .buttons-container {
                gap: 20px;
                margin: 40px 0;
            }
            
            .choice-btn img {
                width: 120px;
            }
            
            #textprint {
                font-size: 1.4rem;
            }
            
            .score-container {
                gap: 40px;
            }
            
            .score {
                font-size: 1.3rem;
            }
            
            .score-value {
                font-size: 1.6rem;
            }
        }
        
        /* Animation classes */
        .animate-win {
            animation: bounce 0.5s ease;
        }
        
        .animate-lose {
            animation: shake 0.5s ease;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ROCK PAPER SCISSORS</h1>

        <div class="buttons-container">
            <button class="choice-btn" onclick="spin(1)">
                <img src="./Stone.png" alt="Rock" />
            </button>
            <button class="choice-btn" onclick="spin(2)">
                <img src="./Paper.png" alt="Paper" />
            </button>
            <button class="choice-btn" onclick="spin(3)">
                <img src="./scissor.png" alt="Scissors" />
            </button>
        </div>

        <div id="textprint">
            Choose your weapon to begin!
        </div>

        <div class="score-container">
            <div class="score">
                Wins: <span id="Wins" class="score-value">0</span>
            </div>
            <div class="score">
                Losses: <span id="Loses" class="score-value">0</span>
            </div>
        </div>

        <button id="reset-btn" onclick="reset()">Reset Game</button>
    </div>
</body>
 <script src="./script.js"></script>
</html>
